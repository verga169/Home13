<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Home13</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg: #b8d0e3;
            --card: rgba(239, 247, 253, 0.68);
            --ink: #14243a;
            --muted: #43596e;
            --line: rgba(42, 73, 103, 0.17);
            --brand: #1977bd;
            --brand-dark: #124d83;
            --danger-bg: #fee2e2;
            --danger-ink: #7f1d1d;
            --shadow: 0 14px 36px rgba(20, 44, 71, 0.18), 0 2px 8px rgba(20, 44, 71, 0.08);
        }

        * { box-sizing: border-box; }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            position: relative;
            isolation: isolate;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background: var(--bg);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            position: fixed;
            z-index: -1;
            inset: 0;
            content: "";
            pointer-events: none;
            background:
                linear-gradient(rgba(183, 207, 229, 0.16), rgba(168, 195, 220, 0.2)),
                url("{{ desktop_wallpaper_url }}") center / cover no-repeat fixed;
        }

        .page {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        .hero {
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            padding: 28px;
            color: #f4fffc;
            border: 1px solid rgba(255, 255, 255, 0.48);
            border-radius: 28px;
            background: linear-gradient(125deg, rgba(30, 62, 94, 0.78), rgba(59, 106, 147, 0.68) 56%, rgba(107, 151, 188, 0.62));
            box-shadow: 0 22px 54px rgba(20, 67, 108, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.46);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            backdrop-filter: blur(24px) saturate(170%);
        }

        .hero::before,
        .hero::after {
            position: absolute;
            border-radius: 50%;
            content: "";
            pointer-events: none;
            filter: blur(2px);
        }

        .hero::before {
            top: -130px;
            right: 8%;
            width: 310px;
            height: 250px;
            background: radial-gradient(ellipse, rgba(240, 249, 255, 0.34), rgba(150, 198, 231, 0.12) 58%, transparent 72%);
        }

        .hero::after {
            right: 25%;
            bottom: -195px;
            width: 380px;
            height: 280px;
            background: radial-gradient(ellipse, rgba(150, 207, 239, 0.24), transparent 72%);
        }

        .hero h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(2.8rem, 5vw, 4.2rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1;
            text-shadow: 0 1px 14px rgba(255, 255, 255, 0.16);
        }

        .hero p {
            position: relative;
            z-index: 1;
            margin: 10px 0 0;
            color: rgba(239, 248, 255, 0.9);
            max-width: 720px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(239, 247, 253, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 22px;
            box-shadow: 0 16px 44px rgba(20, 44, 71, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.76);
            padding: 20px;
            -webkit-backdrop-filter: blur(24px) saturate(155%);
            backdrop-filter: blur(24px) saturate(155%);
        }

        .card h2 {
            margin: 0 0 8px;
            color: #193d5d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.55rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .card > p {
            margin: 0 0 18px;
            color: var(--muted);
        }

        .error {
            margin: 0 0 14px;
            border: 1px solid #fecaca;
            background: var(--danger-bg);
            color: var(--danger-ink);
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 0.92rem;
        }

        .fields {
            display: grid;
            gap: 10px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.88rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 12px;
            padding: 10px;
            font: inherit;
            color: var(--ink);
            min-height: 44px;
            background: rgba(247, 251, 255, 0.74);
            box-shadow: inset 0 1px 2px rgba(20, 44, 71, 0.05), 0 2px 8px rgba(20, 44, 71, 0.04);
            -webkit-backdrop-filter: blur(8px) saturate(135%);
            backdrop-filter: blur(8px) saturate(135%);
        }

        input:focus {
            outline: none;
            border-color: rgba(25, 119, 189, 0.55);
            box-shadow: 0 0 0 3px rgba(25, 119, 189, 0.15);
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            min-height: 44px;
            padding: 11px 14px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.58);
            background: linear-gradient(180deg, rgba(55, 132, 190, 0.84), rgba(24, 79, 128, 0.8));
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(20, 50, 82, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.46), inset 0 -1px 0 rgba(10, 31, 54, 0.16);
            -webkit-backdrop-filter: blur(18px) saturate(175%);
            backdrop-filter: blur(18px) saturate(175%);
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .btn:hover {
            background: linear-gradient(180deg, rgba(73, 151, 209, 0.9), rgba(28, 86, 137, 0.86));
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(20, 50, 82, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.52);
        }

        .btn:active {
            transform: scale(0.98);
            filter: brightness(0.94);
        }

        @media (max-width: 620px) {
            body {
                padding: 14px 10px;
                background-attachment: scroll;
            }

            body::before {
                background:
                    linear-gradient(rgba(218, 235, 248, 0.08), rgba(195, 219, 238, 0.14)),
                    url("{{ mobile_wallpaper_url }}") center / cover no-repeat;
                background-attachment: scroll;
            }

            .hero {
                padding: 20px;
                border-radius: 24px;
                border-color: rgba(255, 255, 255, 0.5);
                background: linear-gradient(125deg, rgba(30, 62, 94, 0.86), rgba(59, 106, 147, 0.76) 58%, rgba(107, 151, 188, 0.7));
                box-shadow: 0 18px 40px rgba(20, 44, 71, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.4);
                -webkit-backdrop-filter: blur(14px) saturate(150%);
                backdrop-filter: blur(14px) saturate(150%);
            }

            .card {
                padding: 16px;
                border-radius: 20px;
                border-color: rgba(255, 255, 255, 0.72);
                background: rgba(239, 247, 253, 0.68);
                box-shadow: 0 8px 22px rgba(20, 44, 71, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.72);
                -webkit-backdrop-filter: blur(10px) saturate(140%);
                backdrop-filter: blur(10px) saturate(140%);
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1>Home13</h1>
            <p>Gestisci spese casa, prestiti e rimborsi</p>
        </section>

        <section class="card">
            <h2>Accedi</h2>
            <p>Inserisci le credenziali per accedere all'app.</p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('login', next=next_path) }}">
                <input type="hidden" name="next" value="{{ next_path }}">
                <div class="fields">
                    <div>
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" autocomplete="username" required>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                </div>
                <button class="btn" type="submit">Accedi</button>
            </form>
        </section>
    </main>
</body>
</html>
