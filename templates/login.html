<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Home13</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --ink: #1c1c1e;
            --muted: #6e6e73;
            --line: #e3e4e8;
            --brand: #008a7a;
            --brand-dark: #007568;
            --danger-bg: #fee2e2;
            --danger-ink: #7f1d1d;
            --shadow: 0 8px 28px rgba(20, 28, 25, 0.065);
        }

        * { box-sizing: border-box; }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: 100%;
            max-width: 1480px;
            margin: 0 auto;
        }

        .hero {
            margin-bottom: 20px;
            padding: 28px;
            color: #f4fffc;
            background: linear-gradient(125deg, #123f3a 0%, #087f73 100%);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .hero h1 {
            margin: 0;
            font-family: "Syne", sans-serif;
            font-size: clamp(1.9rem, 5vw, 2.7rem);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .hero p {
            margin: 10px 0 0;
            color: #d5fff4;
            max-width: 720px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-family: "Syne", sans-serif;
            font-size: 1.35rem;
            letter-spacing: -0.025em;
        }

        .card > p {
            margin: 0 0 18px;
            color: var(--muted);
        }

        .error {
            margin: 0 0 14px;
            border: 1px solid #fecaca;
            background: var(--danger-bg);
            color: var(--danger-ink);
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 0.92rem;
        }

        .fields {
            display: grid;
            gap: 10px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.88rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            font: inherit;
            color: var(--ink);
            min-height: 44px;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: rgba(0, 138, 122, 0.5);
            box-shadow: 0 0 0 3px rgba(0, 138, 122, 0.13);
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            min-height: 44px;
            padding: 11px 14px;
            color: #fff;
            background: linear-gradient(135deg, #008a7a, #00a18f);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(0, 138, 122, 0.18);
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
        }

        .btn:hover {
            background: var(--brand-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 138, 122, 0.22);
        }

        .btn:active {
            transform: scale(0.98);
            filter: brightness(0.94);
        }

        @media (max-width: 620px) {
            body { padding: 14px 10px; }
            .hero { padding: 20px; border-radius: 18px; }
            .card { padding: 16px; border-radius: 14px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1>Home13</h1>
            <p>Gestisci spese casa, prestiti e rimborsi</p>
        </section>

        <section class="card">
            <h2>Accedi</h2>
            <p>Inserisci le credenziali per accedere all'app.</p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('login', next=next_path) }}">
                <input type="hidden" name="next" value="{{ next_path }}">
                <div class="fields">
                    <div>
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" autocomplete="username" required>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                </div>
                <button class="btn" type="submit">Accedi</button>
            </form>
        </section>
    </main>
</body>
</html>
